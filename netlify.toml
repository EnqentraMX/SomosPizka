# Netlify publica la carpeta public/ cada vez que hay un cambio en GitHub.
[build]
  publish = "public"

# Fotos y estilos se guardan en caché para que la página cargue rápido.
[[headers]]
  for = "/*/fotos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
